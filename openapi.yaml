openapi: 3.1.0
info:
  title: CapCut Desktop Unofficial API
  version: 0.1.0
  summary: Reverse-engineered API surface observed from CapCut Desktop traffic
  description: |
    This is an unofficial API specification observed from CapCut Desktop traffic.
    It is based on Singapore-region observations collected on 2026-07-31.

    This specification models observed fields and allows additional properties in dynamic areas.
    This specification models observed fields and allows additional properties in dynamic areas.
  contact:
    name: Local reverse-engineering workspace
  license:
    name: Documentation only
    identifier: LicenseRef-Documentation-Only
externalDocs:
  description: Repository usage and capture notes
  url: ./README.md
servers:
  - url: https://{service}.capcutapi.com
    description: CapCut regional API services observed in the capture
    variables:
      service:
        default: heycan-api-sg
        enum:
          - heycan-api-sg
          - editor-api-sg
          - feed-api-sg
          - commerce-api-sg
          - mcs-normal-sg
          - pc-mon-v2-boot
tags:
  - name: Materials
    description: Effects, stickers, filters, transitions, captions, and panel metadata
  - name: Search
    description: Material search and suggested terms
  - name: Music
    description: Music collections and songs
  - name: Templates
    description: Replicate template collections and template items
  - name: AIGC
    description: AI-generated material helpers
  - name: Configuration
    description: Remote configuration, models, benefits, and compliance
  - name: Telemetry
    description: Client event ingestion
x-capture-evidence:
  observedAt: '2026-07-31'
  region: SG
  evidenceRepository: https://github.com/clipcraft-labs/capcut-research
  observedCapcutApiOperations: 23
  excludedTraffic:
    - image CDN
    - video CDN
    - model binary downloads

