      in: header
      name: X-Khronos
      description: Timestamp paired with the request signature
    XArgus:
      type: apiKey
      in: header
      name: X-Argus
    XLadon:
      type: apiKey
      in: header
      name: X-Ladon
    TDID:
      type: apiKey
      in: header
      name: TDID
    XSSDP:
      type: apiKey
      in: header
      name: X-SS-DP

  parameters:
    AccessKey:
      name: access_key
      in: query
      schema:
        type: string
      description: SDK or service access key observed in the query string
    Aid:
      name: aid
      in: query
      schema:
        oneOf:
          - type: integer
          - type: string
    AppName:
      name: app_name
      in: query
      schema:
        type: string
    DeviceId:
      name: device_id
      in: query
      schema:
        type: string
      description: Client device identifier; never commit a captured real value
    DevicePlatform:
      name: device_platform
      in: query
      schema:
        type: string
    Language:
      name: language
      in: query
      schema:
        type: string
    Region:
      name: region
      in: query
      schema:
        type: string
    VersionCode:
      name: version_code
      in: query
      schema:
        oneOf:
          - type: integer
          - type: string
    VersionName:
      name: version_name
      in: query
      schema:
        type: string

  responses:
