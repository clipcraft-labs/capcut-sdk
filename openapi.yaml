        errmsg:
          type: string
        log_id:
          type: string
        logid:
          type: string
        response: {}
        sign:
          type: string
        svr_time:
          oneOf:
            - type: integer
            - type: string
        systime:
          oneOf:
            - type: integer
            - type: string
        data:
          type: object
          additionalProperties: true
      additionalProperties: true

    FeedEnvelope:
      type: object
      properties:
        ret:
          type: integer
        errmsg:
          type: string
        log_id:
          type: string
        svr_time:
          oneOf:
            - type: integer
            - type: string
        svr_timing:
          type: object
          additionalProperties: true
        data:
          type: object
          additionalProperties: true
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
