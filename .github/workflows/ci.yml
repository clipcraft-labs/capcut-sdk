name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    env:
      PYTHONPATH: src:method2
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s method2/tests -v
      - run: python tools/openapi_inventory.py openapi.yaml > /tmp/openapi-inventory.json
      - run: python tools/public_audit.py .
      - run: python -m compileall -q src tools tests
